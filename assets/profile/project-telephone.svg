      <g transform="translate(174 50)"><rect width="60" height="39" rx="12" fill="#37C9C6" fill-opacity="0.12" stroke="#67DDD8" stroke-opacity="0.21"/><path d="M16 10C18 19 25 27 35 29L42 22L35 17L31 21C27 19 24 16 22 12L26 8L21 2L14 8Z" fill="#56D9D3" transform="scale(.62) translate(4 8)"/><text x="27" y="24" fill="#C5EBEA" font-size="8.5" font-weight="700">CTI</text></g>
      <g transform="translate(174 96)"><rect width="60" height="27" rx="10" fill="#2EB9CA" fill-opacity="0.11" stroke="#5ACDDA" stroke-opacity="0.19"/><text x="9" y="18" fill="#BCE2E6" font-size="8.5" font-weight="700">CLIPBOARD</text></g>
      <g transform="translate(174 130)"><rect width="60" height="27" rx="10" fill="#34C8B8" fill-opacity="0.10" stroke="#67D9CB" stroke-opacity="0.18"/><text x="14" y="18" fill="#C4E9E3" font-size="8.5" font-weight="700">LOOKUP</text></g>
      <text x="18" y="174" fill="#6FA0A9" font-size="9" font-weight="650" letter-spacing="0.9">WINDOWS WORKFLOW · BROWSER AUTOMATION</text>
