<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Yuga Iwata — Software Engineer and Product Builder</title>
  <desc id="desc">A light portfolio header with a translucent glass panel, graphite typography, and restrained blue, violet, and cyan reflections.</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="0" x2="850" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F9FC"/>
      <stop offset="0.55" stop-color="#EEF3F8"/>
      <stop offset="1" stop-color="#E6ECF3"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(716 92) rotate(137) scale(310 225)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#786DF0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#786DF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(130 386) rotate(-35) scale(360 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CBFD9" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#4CBFD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="82" y1="46" x2="822" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#D8EAF2" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="edge" x1="100" y1="46" x2="810" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#A9B9CD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#65AFC6" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="specular" x1="140" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#E9F7FC" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="45" y="14" width="810" height="412" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#33445B" flood-opacity="0.16"/>
    </filter>
    <clipPath id="panelClip"><rect x="74" y="46" width="752" height="348" rx="32"/></clipPath>
    <pattern id="grain" width="43" height="43" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="9" r="0.7" fill="#42536A" fill-opacity="0.09"/>
      <circle cx="31" cy="18" r="0.55" fill="#1586A7" fill-opacity="0.08"/>
      <circle cx="16" cy="35" r="0.6" fill="#4A5B70" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="440" rx="36" fill="url(#bg)"/>
  <rect width="900" height="440" rx="36" fill="url(#violet)"/>
  <rect width="900" height="440" rx="36" fill="url(#cyan)"/>
  <path d="M66 352C190 278 291 395 446 311C608 223 721 275 850 188" fill="none" stroke="#218AA8" stroke-opacity="0.10"/>
  <circle cx="816" cy="72" r="2" fill="#7066DB" fill-opacity="0.34"/>
  <circle cx="846" cy="103" r="1.5" fill="#168DAA" fill-opacity="0.30"/>
  <circle cx="54" cy="329" r="1.5" fill="#168DAA" fill-opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="74" y="46" width="752" height="348" rx="32" fill="url(#glass)" stroke="url(#edge)"/>
    <rect x="75" y="47" width="750" height="346" rx="31" fill="url(#grain)" opacity="0.42" clip-path="url(#panelClip)"/>
    <path d="M118 47.5H777C801 47.5 817.5 65 817.5 87" fill="none" stroke="url(#specular)" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(122 91)">
      <rect width="122" height="30" rx="15" fill="#6D78A8" fill-opacity="0.08" stroke="#566B87" stroke-opacity="0.20"/>
      <circle cx="18" cy="15" r="4" fill="#149AB8"/>
      <text x="31" y="20" fill="#41526A" font-size="13" font-weight="650" letter-spacing="1.2">JAPAN · JST</text>
    </g>
    <text x="120" y="184" fill="#151A23" font-size="54" font-weight="680" letter-spacing="-1.8">Yuga Iwata</text>
    <text x="122" y="220" fill="#455269" font-size="21" font-weight="550" letter-spacing="0.2">Software Engineer · Product Builder</text>
    <text x="122" y="266" fill="#202938" font-size="18" font-weight="440">
      <tspan x="122" dy="0">I build practical software that turns complex workflows</tspan>
      <tspan x="122" dy="27">into clear, usable experiences.</tspan>
    </text>
    <text x="122" y="336" fill="#64748A" font-size="12" font-weight="700" letter-spacing="1.7">FOCUS</text>
    <text x="191" y="336" fill="#344156" font-size="14" font-weight="560">AR</text>
    <circle cx="224" cy="331" r="2" fill="#8593A6"/>
    <text x="238" y="336" fill="#344156" font-size="14" font-weight="560">Automation</text>
    <circle cx="331" cy="331" r="2" fill="#8593A6"/>
    <text x="345" y="336" fill="#344156" font-size="14" font-weight="560">Web MIDI</text>
    <circle cx="430" cy="331" r="2" fill="#8593A6"/>
    <text x="444" y="336" fill="#344156" font-size="14" font-weight="560">Developer Tools</text>
  </g>

  <g transform="translate(667 287)" opacity="0.78">
    <path d="M0 26H91" stroke="#58718E" stroke-opacity="0.32"/>
    <circle cx="8" cy="26" r="5" fill="#20A9C3"/>
    <circle cx="46" cy="26" r="5" fill="#6270DF"/>
    <circle cx="84" cy="26" r="5" fill="#8C68D9"/>
    <path d="M8 26C21 26 28 6 46 6C64 6 69 26 84 26" fill="none" stroke="#526B87" stroke-opacity="0.68" stroke-width="1.5"/>
  </g>
</svg>
