<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">ChainHardcore</title>
  <desc id="desc">A server-side Paper plugin that connects Minecraft players with chain tension, pulling behavior, multiple connection modes, and a solo test mode.</desc>
